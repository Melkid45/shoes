<link rel="stylesheet" href="./product.scss" />

<article class="product__item">
  <div class="product__item-top">
    <div class="top__info">
      <span class="text text--sm">В наличии</span>
      <button type="button" aria-label="Добавить в избранное">
        <i data-lucide="heart"></i>
      </button>
    </div>
    <img
      src="@/assets/_images/slide.png"
      alt="Чёрные кожаные кеды «Движение»"
    />
    <div class="top__attr">
      <div class="top__attr-size">
        <div class="min text text--sm">39</div>
        <span class="text text--md">-</span>
        <div class="max text text--sm">47</div>
      </div>
      <div class="top__attr-color">
        <div class="color__item"></div>
        <div class="color__item"></div>
      </div>
    </div>
  </div>
  <div class="product__item-bot">
    <div class="bot__information">
      <div class="bot__information-text">
        <h3 class="text text--md text--semi">
          <a href="./product.html">Кеды «Движение»</a>
        </h3>
        <p class="text text--sm">Легкие кеды из кожи</p>
      </div>
      <div class="bot__information-review">
        <div class="review__stars">
          <i data-lucide="star"></i>
          <i data-lucide="star"></i>
          <i data-lucide="star"></i>
          <i data-lucide="star"></i>
          <i data-lucide="star"></i>
        </div>
        <div class="review__value">
          <p class="text text--sm">4.5</p>
          <span class="text text--xs">(9)</span>
        </div>
      </div>
    </div>
    <div class="bot__action">
      <div class="bot__action-price">
        <span class="text text--lg text--semi">5 990 ₽</span>
        <p class="text text--xs">7 400 ₽</p>
      </div>
      <button class="button button--primary">В корзину</button>
    </div>
  </div>
</article>
