<link rel="stylesheet" href="./form.scss" />


<section id="contacts" class="block block--pb request">
    <div class="container">
        <div class="request__body">
            <div class="request__body-text">
                <h2 class="heading heading--lg">
                    Давайте поговорим
                </h2>
                <p class="text text--lg">
                    О продукции, выборе пары или сотрудничестве. <br>
                    Оставьте сообщение - передадим его нужному <br>
                    специалисту.
                </p>
            </div>
            <form class="request__body-form" action="">
                <div class="form__inputs">
                    <input type="text" placeholder="Ваше имя *" class="text text--md">
                    <input type="text" placeholder="E-mail или телефон *" class="text text--md">
                    <input type="text" placeholder="Ваше сообщение *" class="text text--md">
                </div>
                <div class="form__action">
                    <div class="form__action-checkbox">
                        <div>
                            <input type="checkbox">
                        </div>
                        <p class="text text--md">
                            Согласен на обработку персональных данных
                        </p>
                    </div>
                    <button class="button button--primary">
                        Отправить сообщение
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
